<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit - RouterVault</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8;margin:0}.wrap{max-width:1500px;margin:auto;padding:24px}.panel{background:#111a2e;border:1px solid #24324d;border-radius:14px;padding:18px}a{color:#9cc6ff}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #24324d;text-align:left;font-size:13px}</style></head><body><div class="wrap"><a href="/settings">← Settings</a><h1>Audit Log</h1><div class="panel"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr>{% for r in rows %}<tr><td>{{ r.created_at }}</td><td>{{ r.username }}</td><td>{{ r.action }}</td><td>{{ r.entity_type or '' }} {{ r.entity_id or '' }}</td><td>{{ r.details or '' }}</td></tr>{% endfor %}</table></div></div></body></html>
