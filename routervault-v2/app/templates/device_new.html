<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Device - {{ app_name }}</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111a2e;--line:#24324d;--text:#e5edf8;--muted:#93a4ba;--blue:#3b82f6}*{box-sizing:border-box}body{font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0}.wrap{max-width:760px;margin:42px auto;padding:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}a{color:#9cc6ff;text-decoration:none}label{display:block;color:var(--muted);font-size:13px;margin:15px 0 6px}input,select{width:100%;padding:11px;background:#0f172a;color:var(--text);border:1px solid #334155;border-radius:8px}.btn{margin-top:20px;background:var(--blue);color:white;border:0;border-radius:8px;padding:11px 15px;font-weight:800;cursor:pointer}.newbox{margin-top:10px;padding:12px;border:1px dashed #475569;border-radius:8px;background:#0f172a}.hidden{display:none}.hint{font-size:12px;color:var(--muted);margin-top:5px}
</style></head><body><div class="wrap"><a href="/">← Dashboard</a><div class="panel"><h1>Add Device</h1><form id="device-form" method="post" action="/devices/new">
<label>Device name / Identity</label><input name="device_name" placeholder="MT-HQ-01" required>
<label>Customer</label><select id="customer-select"><option value="">Select customer...</option>{% for customer in customers %}<option value="{{ customer.name }}" data-id="{{ customer.id }}">{{ customer.name }}</option>{% endfor %}<option value="__new__">+ New Customer</option></select>
<div id="new-customer-box" class="newbox hidden"><label>New Customer name</label><input id="new-customer-name" placeholder="Example Company"><div class="hint">Created automatically with the device.</div></div><input type="hidden" name="customer_name" id="customer-final">
<label>Site</label><select id="site-select"><option value="">No site / Select site...</option>{% for site in sites %}<option value="{{ site.name }}" data-customer-id="{{ site.customer_id }}">{{ site.name }}</option>{% endfor %}<option value="__new__">+ New Site</option></select>
<div id="new-site-box" class="newbox hidden"><label>New Site name</label><input id="new-site-name" placeholder="Athens HQ"><div class="hint">Created under the selected customer.</div></div><input type="hidden" name="site_name" id="site-final">
<label>Model (optional)</label><input name="model" placeholder="RB5009 / RB4011 / CRS326"><button class="btn" type="submit">Create & Generate Script</button></form></div></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('customer-select'),s=document.getElementById('site-select'),cb=document.getElementById('new-customer-box'),sb=document.getElementById('new-site-box'),cn=document.getElementById('new-customer-name'),sn=document.getElementById('new-site-name'),cf=document.getElementById('customer-final'),sf=document.getElementById('site-final'),form=document.getElementById('device-form');function cid(){const o=c.options[c.selectedIndex];return o?o.dataset.id||'':''}function filterSites(){const id=cid(),isNew=c.value==='__new__';[...s.options].forEach(o=>{if(o.value===''||o.value==='__new__'){o.hidden=false;return}o.hidden=isNew|| (!!id&&o.dataset.customerId!==id)});if(s.selectedOptions[0]&&s.selectedOptions[0].hidden)s.value=''}c.addEventListener('change',()=>{const n=c.value==='__new__';cb.classList.toggle('hidden',!n);filterSites();if(n){s.value='__new__';sb.classList.remove('hidden')}});s.addEventListener('change',()=>sb.classList.toggle('hidden',s.value!=='__new__'));form.addEventListener('submit',e=>{if(c.value==='__new__'){if(!cn.value.trim()){alert('Enter the new Customer name.');e.preventDefault();return}cf.value=cn.value.trim()}else{if(!c.value){alert('Select a Customer.');e.preventDefault();return}cf.value=c.value}if(s.value==='__new__'){if(!sn.value.trim()){alert('Enter the new Site name.');e.preventDefault();return}sf.value=sn.value.trim()}else sf.value=s.value});filterSites()});
</script></body></html>
