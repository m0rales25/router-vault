<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ site.name }} - RouterVault</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8;margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}a{color:#9cc6ff;text-decoration:none}.panel{background:#111a2e;border:1px solid #24324d;border-radius:14px;padding:18px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #24324d;text-align:left}.badge{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.UP{background:#123d27;color:#73e6a1}.DOWN{background:#4a171b;color:#ff9da4}.WAITING{background:#4a3410;color:#ffd37a}</style></head><body><div class="wrap"><a href="/customers/{{ customer.id }}">← {{ customer.name }}</a><h1>{{ site.name }}</h1><div class="panel"><table><tr><th>Device</th><th>Model</th><th>RouterOS</th><th>Status</th><th>Last heartbeat</th><th>Last backup</th></tr>{% for d in devices %}<tr><td><a href="/devices/{{ d.id }}">{{ d.name }}</a></td><td>{{ d.model or '-' }}</td><td>{{ d.routeros_version or '-' }}</td><td><span class="badge {{ device_status(d) }}">{{ device_status(d) }}</span></td><td>{{ d.last_seen_at or '-' }}</td><td>{{ d.last_backup_at or '-' }}</td></tr>{% endfor %}</table></div></div></body></html>
