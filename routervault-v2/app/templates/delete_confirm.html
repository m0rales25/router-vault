<!doctype html><html><head><meta charset="utf-8"><title>Delete {{ device.name }}</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8}.box{max-width:650px;margin:60px auto;background:#111a2e;border:1px solid #7f1d1d;border-radius:14px;padding:24px}input,select,button{width:100%;padding:11px;margin:8px 0;background:#0f172a;color:white;border:1px solid #334155;border-radius:8px}.danger{background:#991b1b}</style></head><body><div class="box"><a href="/devices/{{ device.id }}" style="color:#9cc6ff">← Cancel</a><h1>Delete {{ device.name }}</h1><p>This device has <b>{{ backup_count }}</b> backup records.</p><form method="post" action="/devices/{{ device.id }}/delete/execute"><label>Type the device name to confirm</label><input name="confirm_name" required autocomplete="off"><label>Stored backup objects</label><select name="delete_backups"><option value="yes">Delete device + MinIO backups</option><option value="no">Delete device metadata but preserve MinIO objects</option></select><button class="danger" type="submit">Delete permanently</button></form></div></body></html>
