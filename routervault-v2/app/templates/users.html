<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users - RouterVault</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8;margin:0}.wrap{max-width:1200px;margin:auto;padding:24px}.panel{background:#111a2e;border:1px solid #24324d;border-radius:14px;padding:18px;margin-bottom:18px}a{color:#9cc6ff}input,select,button{padding:9px;background:#0f172a;color:white;border:1px solid #334155;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #24324d;text-align:left}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}</style></head><body><div class="wrap"><a href="/settings">← Settings</a><h1>Users & Roles</h1><div class="panel"><h2>Create user</h2><form method="post" action="/users/new"><div class="grid"><input name="username" placeholder="username" required><input name="password" type="password" placeholder="password (8+)" required><select name="role"><option value="read_only">Read only</option><option value="customer">Customer restricted</option><option value="admin">Admin</option></select><select name="customer_id"><option value="">No customer restriction</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><button style="margin-top:10px">Create</button></form></div><div class="panel"><table><tr><th>User</th><th>Role</th><th>Customer</th><th>Enabled</th><th></th></tr>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td><td>{{ u.customer_id or '-' }}</td><td>{{ u.enabled }}</td><td><form method="post" action="/users/{{ u.id }}/toggle"><input type="hidden" name="enabled" value="{{ 0 if u.enabled else 1 }}"><button>{{ 'Disable' if u.enabled else 'Enable' }}</button></form></td></tr>{% endfor %}</table></div></div></body></html>
